media:
  - name: portfolio_images
    label: Portfolio Images
    input: images/uploads
    output: /images/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: artworks
    label: Portfolio Artworks
    type: file
    path: portfolio.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: character
              label: CHARACTER
            - name: illustration
              label: ILLUSTRATION
            - name: study
              label: STUDY
            - name: fanart
              label: FANART
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: portfolio_images
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: published
        label: Published
        type: boolean
        default: true
        description: Turn this off to hide the artwork without deleting it.
